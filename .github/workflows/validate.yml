name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - architecture-cleanup-2026-09

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate dependency lockfile during cleanup
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Regenerate dependency lockfile [skip ci]"
            git push origin HEAD:architecture-cleanup-2026-09
          fi

      - name: Install dependencies from regenerated lockfile
        run: npm ci

      - name: Report dependency vulnerabilities
        run: npm audit || true

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
