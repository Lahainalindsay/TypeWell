name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - architecture-cleanup-2026-09

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate dependency lockfile during cleanup
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies from regenerated lockfile
        run: npm ci

      - name: Report dependency vulnerabilities
        run: npm audit || true

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
