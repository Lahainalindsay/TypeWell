name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - architecture-cleanup-2026-09

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: npm audit || true

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
