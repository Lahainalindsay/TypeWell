<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><rect width="760" height="280" fill="#132137"/><g fill="#eef7fa" font-family="system-ui,sans-serif"><text x="30" y="59" font-size="30" font-weight="700">Three levels of data entry</text><rect x="30" y="97" width="224" height="148" rx="14" fill="#1b3349" stroke="#52677b"/><text x="44" y="134" font-size="20" font-weight="700" fill="#f5c5bc">Characters</text><text x="44" y="171" font-size="16">Copy the text</text><text x="44" y="207" font-size="13">Digits, letters and punctuation</text><rect x="270" y="97" width="224" height="148" rx="14" fill="#1b3349" stroke="#52677b"/><text x="284" y="134" font-size="20" font-weight="700" fill="#f5c5bc">Fields</text><text x="284" y="171" font-size="16">Preserve exact values</text><text x="284" y="207" font-size="13">Case, spaces and leading zeroes</text><rect x="510" y="97" width="224" height="148" rx="14" fill="#1b3349" stroke="#52677b"/><text x="524" y="134" font-size="20" font-weight="700" fill="#f5c5bc">Records</text><text x="524" y="171" font-size="16">Check the whole entry</text><text x="524" y="207" font-size="13">One wrong field changes the record</text></g></svg>
