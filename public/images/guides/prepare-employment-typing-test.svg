<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><rect width="760" height="280" fill="#132137"/><g fill="#eef7fa" font-family="system-ui,sans-serif"><text x="30" y="59" font-size="30" font-weight="700">A ten-minute practice routine</text><rect x="30" y="97" width="224" height="148" rx="14" fill="#1b3349" stroke="#52677b"/><text x="44" y="134" font-size="20" font-weight="700" fill="#d7c8ff">2 minutes</text><text x="44" y="171" font-size="16">Warm up slowly</text><text x="44" y="207" font-size="13">Use familiar text</text><rect x="270" y="97" width="224" height="148" rx="14" fill="#1b3349" stroke="#52677b"/><text x="284" y="134" font-size="20" font-weight="700" fill="#d7c8ff">3 minutes</text><text x="284" y="171" font-size="16">Drill one error</text><text x="284" y="207" font-size="13">Repeat a difficult pattern</text><rect x="510" y="97" width="224" height="148" rx="14" fill="#1b3349" stroke="#52677b"/><text x="524" y="134" font-size="20" font-weight="700" fill="#d7c8ff">5 minutes</text><text x="524" y="171" font-size="16">Take a timed sample</text><text x="524" y="207" font-size="13">Record speed and accuracy</text></g></svg>
